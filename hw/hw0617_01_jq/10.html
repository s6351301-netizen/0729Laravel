<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <title>計算機只有加法</title>
</head>
<style>
    .box {
        width: 300px;
        height: 300px;
        background-color: antiquewhite;
        margin: auto;
        margin-top: 20px;
        border-radius: 20px;
    }

    .input-container {
        background-color: aqua;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;

    }

    .output-container{
        background-color: rgb(219, 205, 247);
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 50px;
    }

    input {
        width: 80%;
        height: 30px;
        border-radius: 20px;
        text-align: center;
    }

    button:hover{
        box-shadow: 0 5px 20px black;
    }
    button {
        width: 50%;
        height: 30px;
        border-radius: 20px;
       
    }
</style>

<body>
    <div class="box input-container">
        <input type="text" name="num1" id="num1" value="100" placeholder="num1?">
        <input type="text" name="num2" id="num2" value="200" placeholder="num2?">
        <input type="text" name="opt" id="opt" value="+" placeholder="opt?">
        <button type="button" id="mybtn">submit</button>
    </div>
    <div class="box output-container">
        <span id="myspan">1 + 1 = 2</span>
    </div>

</body>

</html>

<script>
    $(document).ready(function(){
    const mybtn =$('#mybtn');
    const num1 =$('#num1');
    const num2 =$('#num2');
    const opt =$('#opt');
    const myspan =$('#myspan');

    console.log('mybtn',mybtn);
    console.log('num1',num1);
    console.log('num2',num2);
    console.log('opt',opt);
    console.log('myspan',myspan);

    mybtn.click(function(e){
        let getnum1 =Number(num1.val());
        let getnum2 =Number(num2.val());
        let getopt =opt.val();
      

        
        // console.log('getnum1',getnum1);
        // console.log('typeof getnum1',typeof (getnum1));
        // console.log('getnum',getnum2);
        // console.log('typeof getnum2',typeof (getnum2));
        // console.log('getopt',getopt);   

        let result=0;
        if(getopt == "+"){
            result = getnum1 + getnum2;
        }
    
        console.log('result',result);

        let tmpText = `${getnum1} ${getopt} ${getnum2} = ${result}`
        myspan.text(tmpText);
    });
    
});

</script>
