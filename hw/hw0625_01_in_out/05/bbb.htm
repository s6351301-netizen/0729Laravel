<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    </style>
</head>

<body>
    <form action="./bbbapi.php" method="get" id="myForm">
        <p>
            <label for="text">text</label>
            <input type="text" name="text" id="text" value="abc">
        </p>
        <p>
            <label for="count">count</label>
            <input type="text" name="count" id="count" value="2">
        </p>
        <p>
            <input type="submit" value="submit">
        </p>
    </form>

    <!-- 結果顯示區 -->
    <p>Result: <span id="resultBox"></span></p>

    <!-- jquery  -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
        $(document).ready(function () {

            // 1.bind
            const myForm = $('#myForm');

            // 1. 按下submit
            myForm.submit(function (e) {
                // form submit 擋住
                e.preventDefault();
                
                // 2. data = form data
                let data = $(this).serialize();

                // 3. ajax to php
                let url = './bbbapi.php';
                $.ajax({
                    type: "get",
                    url: url,
                    data: data,
                    dataType: "json",
                    success: function (res) {
                        console.log('res', res);
                        
                        // 4. get res & 5. res show output
                        $('#resultBox').text(res.result);
                    }
                });
                // 3. ajax to php end

            });

        });
    </script>
</body>

</html>
