
<style>
:root {
  color-scheme: dark;
  --bg: #06101a;
  --surface: rgba(14, 24, 40, 0.94);
  --surface-strong: rgba(10, 16, 28, 0.98);
  --surface-soft: rgba(28, 48, 78, 0.88);
  --border: rgba(96, 172, 255, 0.16);
  --accent: #6ed1ff;
  --accent-strong: #4ab6ff;
  --text: #e7eef7;
  --text-muted: #8faac8;
  --danger: #ff6d72;
  --radius: 18px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top left, rgba(86, 168, 255, 0.12), transparent 24%),
    linear-gradient(180deg, #040a12 0%, #08111d 100%);
  color: var(--text);
  display: grid;
  place-items: center;
  padding: 24px;
}

.calc-wrap {
  width: min(620px, 100%);
  margin: 0 auto;
  padding: 1.5rem 1rem;
}

.calc-title {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

h1.main {
  font-size: 2.3rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 0.8rem;
}

.desc {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.7;
  margin-bottom: 1.6rem;
}

.card {
  background: linear-gradient(180deg, rgba(11, 18, 32, 0.98), rgba(14, 22, 43, 0.98));
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) * 1.1);
  padding: 1.5rem;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
}

.field {
  margin-bottom: 1rem;
}

.field label {
  display: block;
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.field input {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1px solid rgba(109, 158, 215, 0.18);
  border-radius: 14px;
  background: rgba(10, 18, 32, 0.95);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(110, 209, 255, 0.08);
}

.field .hint {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  color: #7d98be;
}

.unit-toggle {
  display: flex;
  gap: 10px;
  margin-bottom: 1rem;
}

.unit-btn {
  flex: 1;
  min-height: 46px;
  border: 1px solid rgba(109, 158, 215, 0.18);
  border-radius: 14px;
  background: rgba(10, 18, 32, 0.94);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.18s ease;
}

.unit-btn.active {
  background: linear-gradient(180deg, rgba(59, 168, 255, 0.16), rgba(13, 32, 58, 0.96));
  border-color: var(--accent);
  color: #ffffff;
  box-shadow: 0 14px 28px rgba(31, 95, 164, 0.15);
}

.activity-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 1rem;
}

.act-btn {
  padding: 14px 12px;
  border: 1px solid rgba(109, 158, 215, 0.12);
  border-radius: 16px;
  background: rgba(12, 24, 40, 0.94);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  line-height: 1.45;
  transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}

.act-btn:hover {
  transform: translateY(-1px);
}

.act-btn .act-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #ffffff;
}

.act-btn .act-sub {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-muted);
}

.act-btn.active {
  border-color: var(--accent);
  background: rgba(37, 78, 136, 0.95);
}

.act-btn.active .act-label {
  color: var(--accent-strong);
}

.act-btn.active .act-sub {
  color: rgba(126, 217, 255, 0.9);
}

.calc-btn {
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #4dbeff, #1f70e3);
  color: #ffffff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 0.5rem;
  transition: transform 0.18s ease, filter 0.18s ease;
}

.calc-btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.05);
}

.calc-btn i {
  font-size: 18px;
}

.result-area {
  margin-top: 1.5rem;
}

.result-card {
  background: linear-gradient(180deg, rgba(14, 22, 38, 0.96), rgba(9, 15, 28, 0.96));
  border: 1px solid rgba(110, 209, 255, 0.14);
  border-radius: 24px;
  padding: 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
}

.result-icon {
  font-size: 36px;
  color: var(--accent);
  margin-bottom: 10px;
}

.result-val {
  font-size: 44px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1;
}

.result-unit,
.result-cups,
.result-oz {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-muted);
}

.result-hidden {
  display: none;
}

.err {
  font-size: 12px;
  color: var(--danger);
  margin-top: 6px;
  display: none;
}

.section-title {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
  margin-top: 1rem;
}

@media (max-width: 520px) {
  .calc-wrap {
    padding: 1.2rem 0.75rem;
  }

  .card {
    padding: 1.25rem;
  }

  .unit-toggle {
    flex-direction: column;
  }

  .activity-grid {
    grid-template-columns: 1fr;
  }

  .calc-btn {
    height: 46px;
  }
}
</style>

<h2 class="sr-only">每日飲水量計算機</h2>

<div class="calc-wrap">
  <p class="calc-title">我一天該喝多少水？</p>
  <h1 class="main">每日飲水量計算機</h1>
  <p class="desc">輸入你的基本資料，計算每日建議飲水量，維持最佳健康狀態。</p>

  <div class="card">
    <div class="field">
      <label>單位系統</label>
      <div class="unit-toggle">
        <button class="unit-btn active" id="btn-metric" type="button">公制（公斤 / 毫升）</button>
        <button class="unit-btn" id="btn-imperial" type="button">英制（磅 / 盎司）</button>
      </div>
    </div>

    <div class="field">
      <label id="weight-label">體重（公斤）</label>
      <input type="number" id="weight" placeholder="輸入你的體重" min="1" max="500" step="0.1">
      <span class="err" id="err-weight">請輸入有效的體重</span>
    </div>

    <div class="field">
      <label>年齡</label>
      <input type="number" id="age" placeholder="輸入你的年齡" min="1" max="120" step="1">
      <span class="err" id="err-age">請輸入有效的年齡（1–120）</span>
    </div>

    <div class="field">
      <label class="section-title">每周活動量</label>
      <div class="activity-grid">
        <button class="act-btn active" data-val="1.0" type="button">
          <span class="act-label">久坐</span>
          <span class="act-sub">幾乎沒有運動</span>
        </button>
        <button class="act-btn" data-val="1.1" type="button">
          <span class="act-label">輕度活動</span>
          <span class="act-sub">每週 1–3 天</span>
        </button>
        <button class="act-btn" data-val="1.25" type="button">
          <span class="act-label">中度活動</span>
          <span class="act-sub">每週 3–5 天</span>
        </button>
        <button class="act-btn" data-val="1.4" type="button">
          <span class="act-label">高度活動</span>
          <span class="act-sub">每週 6–7 天</span>
        </button>
        <button class="act-btn" data-val="1.55" type="button" style="grid-column:span 2">
          <span class="act-label">極高強度活動</span>
          <span class="act-sub">每天高強度運動 2 次以上</span>
        </button>
      </div>
    </div>

    <button class="calc-btn" id="calc-btn" type="button">
      <i class="ti ti-droplet" aria-hidden="true"></i>
      計算
    </button>

    <div class="result-area result-hidden" id="result-area">
      <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:8px;margin-top:0.5rem">你每日所需的飲水量</div>
      <div class="result-card">
        <div class="result-icon"><i class="ti ti-droplet-filled" aria-hidden="true"></i></div>
        <div class="result-val" id="result-main">—</div>
        <div class="result-unit" id="result-unit">毫升</div>
        <div class="result-cups" id="result-cups"></div>
        <div class="result-oz" id="result-oz"></div>
      </div>
      <div style="font-size:12px;color:var(--color-text-tertiary);margin-top:10px;line-height:1.6">
        以體重 × 33 ml 為基準，再依年齡與活動量調整。此數值僅供參考。
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
$(function(){
  var isMetric = true;
  var activity = 1.0;

  $('#btn-metric').on('click', function(){
    isMetric = true;
    $('#btn-metric').addClass('active');
    $('#btn-imperial').removeClass('active');
    $('#weight-label').text('體重（公斤）');
    $('#weight').attr('placeholder','輸入你的體重').val('');
    $('#result-area').addClass('result-hidden');
  });

  $('#btn-imperial').on('click', function(){
    isMetric = false;
    $('#btn-imperial').addClass('active');
    $('#btn-metric').removeClass('active');
    $('#weight-label').text('體重（磅）');
    $('#weight').attr('placeholder','輸入你的體重').val('');
    $('#result-area').addClass('result-hidden');
  });

  $('.act-btn').on('click', function(){
    $('.act-btn').removeClass('active');
    $(this).addClass('active');
    activity = parseFloat($(this).data('val'));
  });

  $('#calc-btn').on('click', function(){
    var wVal = parseFloat($('#weight').val());
    var aVal = parseInt($('#age').val());
    var valid = true;

    $('#err-weight, #err-age').hide();

    if(!wVal || wVal <= 0 || wVal > 500){
      $('#err-weight').show(); valid = false;
    }
    if(!aVal || aVal < 1 || aVal > 120){
      $('#err-age').show(); valid = false;
    }
    if(!valid) return;

    var weightKg = isMetric ? wVal : wVal * 0.453592;
    var baseMl = weightKg * 33;

    var ageFactor = 1.0;
    if(aVal < 30) ageFactor = 1.05;
    else if(aVal <= 55) ageFactor = 1.0;
    else ageFactor = 0.95;

    var totalMl = Math.round(baseMl * activity * ageFactor);
    var totalOz = Math.round(totalMl / 29.5735);
    var cups = (totalMl / 250).toFixed(1);

    var dispMain, dispUnit, dispCups, dispOz;
    if(isMetric){
      dispMain = totalMl.toLocaleString();
      dispUnit = '毫升';
      dispCups = '約 ' + cups + ' 杯（每杯 250 ml）';
      dispOz = '≈ ' + totalOz + ' fl oz';
    } else {
      dispMain = totalOz;
      dispUnit = '盎司（fl oz）';
      dispCups = '≈ ' + totalMl.toLocaleString() + ' 毫升';
      dispOz = '約 ' + cups + ' 杯（每杯 250 ml）';
    }

    $('#result-main').text(dispMain);
    $('#result-unit').text(dispUnit);
    $('#result-cups').text(dispCups);
    $('#result-oz').text(dispOz);
    $('#result-area').removeClass('result-hidden');
  });

  $('#weight, #age').on('keydown', function(e){
    if(e.key === 'Enter') $('#calc-btn').trigger('click');
  });
});
</script>
