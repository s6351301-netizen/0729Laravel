<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浪漫和風粉紅圓點星星草莓屋</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* 浪漫粉紅背景 + 日系網點 + 璀璨金色小星星效果 */
        body {
            background-color: #ffe5ec;
            background-image:
                radial-gradient(#ffffff 15%, transparent 15%),
                radial-gradient(#ffffff 15%, transparent 15%),
                /* 用純 CSS 模擬金色閃爍小星星 */
                radial-gradient(rgba(255, 215, 0, 0.4) 8%, transparent 8%);
            background-size: 40px 40px, 40px 40px, 60px 60px;
            background-position: 0 0, 20px 20px, 10px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        /* 原本 300px 放大 1.6 倍 = 480px */
        .box {
            width: 480px;
            height: auto;
            min-height: 480px;
            /* 卡片採用夢幻的軟糖櫻粉色 */
            background-color: #fff2f5;
            margin: auto;
            /* 圓角放大至 48px，極致圓潤可愛 */
            border-radius: 48px;
            text-align: center;
            /* 內襯距放大 1.6 倍 = 32px */
            padding: 32px;
            /* 甜美草莓紅雙邊框與立體極光陰影 */
            border: 6px double #ff9ebb;
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.35);
            position: relative;
            overflow: hidden;
        }

        /* 裝飾元素：左上角可愛小房子、小花與閃亮小星星 */
        .box::before {
            content: "✨🏡🌼";
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 26px;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.1));
        }

        /* 裝飾元素：右下角小草莓、小花與閃亮小星星 */
        .box::after {
            content: "✨🍓🌼";
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 26px;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.1));
        }

        p {
            margin: 22px 0;
        }

        /* 輸入框與按鈕尺寸全面放大 1.6 倍 */
        input,
        button {
            padding: 12px 18px;
            font-size: 19px;
            border-radius: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input {
            width: 85%;
            border: 2px dashed #ff69b4;
            /* 浪漫極光粉手作虛線 */
            background-color: #ffffff;
            color: #4a3b3b;
            text-align: center;
        }

        input:focus {
            border-style: solid;
            border-color: #ff477e;
            background-color: #fffafb;
            box-shadow: 0 0 12px rgba(255, 71, 126, 0.4);
        }

        /* 浪漫星空草莓紅按鈕 */
        button {
            background: linear-gradient(135deg, #ff758f 0%, #ff477e 100%);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 71, 126, 0.4);
            width: 65%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: linear-gradient(135deg, #ff477e 0%, #ba184c 100%);
            transform: translateY(-2px) scale(1.02);
        }

        button:active {
            transform: translateY(1px);
        }

        /* 顯示框：草莓歐蕾底襯搭配復古和風深赤茶色文字 */
        #mySpan {
            display: block;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #5c3d41;
            line-height: 1.6;
            background-color: #ffe5ec;
            padding: 16px;
            border-radius: 24px;
            border: 2px dashed #ff9ebb;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>

<body>

    <div class="box">
        <p>
            <input type="text" id="name" placeholder="🍓 請輸入姓名...." value="玉珍">
        </p>
        <p>
            <input type="text" id="text" placeholder="🏡 請輸入座右銘...." value="天天好心情">
        </p>
        <p>
            <button type="button" id="myBtn">✨ 點我收集星空好心情 ✨</button>
        </p>

        <span id="mySpan">我是 玉珍 ， 我的人生座右銘是： 天天好心情</span>
    </div>

    <script>
        // 1. 取得 HTML 元素的控制權
        const nameInput = document.getElementById('name');
        const textInput = document.getElementById('text');
        const myBtn = document.getElementById('myBtn');
        const mySpan = document.getElementById('mySpan');

        // 2. 為按鈕綁定「點擊 (click)」事件
        myBtn.addEventListener('click', function () {
            // 3. 取得輸入框目前填寫的數值
            let nameValue = nameInput.value.trim();
            let textValue = textInput.value.trim();

            // 檢查使用者有沒有填寫
            if (nameValue === "" || textValue === "") {
                alert("✨ 溫馨提示：請把姓名與小房子裡的星空座右銘填寫完整唷！ ✨");
                return;
            }

            // 4. 使用樣版字串 (Template Literals) 組合文字
            let resultText = `我是 ${nameValue} ， 我的人生座右銘是： ${textValue}`;

            // 5. 將浪漫可愛的文字渲染到 <span> 標籤中
            mySpan.textContent = resultText;
        });
    </script>
</body>

</html>
