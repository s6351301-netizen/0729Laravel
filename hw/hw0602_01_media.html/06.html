<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        body {
            background-color: pink; 
            margin: 0;
            padding: 10px;
        }

        .container {
            width: 90%;
            margin: 0 auto 30px auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .item {
            width: 100%;
            max-width: 400px;
        }

        .item img {
            width: 100%;
            height: auto;
            display: block;
        }


        @media screen and (min-width: 1024px) {
            body {
                background-color: lightblue; 
            }

            .container {
                width: 80%;
                max-width: 1300px;
                height: auto; 
                margin: 50px auto;

               
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 0;
            }

            .item {
                width: 400px; 
                height: 400px; 
            }
            
            .item img {
                width: 100%;
                height: 100%;
                object-fit: cover; 
            }
        }
    </style>
</head>

<body>

    <div class="container container-1">
        <div class="item">
            <img src="https://picsum.photos/400/400?random=4" alt="Image 4">
        </div>
        <div class="item">
            <img src="https://picsum.photos/400/400?random=5" alt="Image 5">
        </div>
        <div class="item">
            <img src="https://picsum.photos/400/400?random=6" alt="Image 6">
        </div>
    </div>

    <div class="container container-2">
        <div class="item">
            <img src="https://picsum.photos/400/400?random=7" alt="Image 7">
        </div>
        <div class="item">
            <img src="https://picsum.photos/400/400?random=8" alt="Image 8">
        </div>
        <div class="item">
            <img src="https://picsum.photos/400/400?random=9" alt="Image 9">
        </div>
    </div>

</body>

</html>
