<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox 響應式風景圖網格</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding:20px;
    transition:background-color .3s;
}

/* 狀態面板 */
.container{
    text-align:center;
    background:rgba(255,255,255,.9);
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    margin-bottom:30px;
    max-width:600px;
    margin-left:auto;
    margin-right:auto;
}

.pixel-display{
    font-size:2rem;
    color:#ff4757;
    font-weight:bold;
    margin:10px 0;
}

/* 圖片區 */
.gallery-flex{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
    width:100%;
    max-width:1200px;
    margin:auto;
}

/* 卡片 */
.card{
    flex:1 1 100%;
    max-width:100%;
    height:clamp(250px,25vw,500px);
    overflow:hidden;
    border-radius:12px;
    background:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .4s ease;
}

.card:hover img{
    transform:scale(1.08);
}

/* 手機 */
body{
    background:lightcoral;
}

.status::after{
    content:"手機直向 (<576px) ➜ 1欄";
}

/* 手機橫向 */
@media (min-width:576px){

    body{
        background:lightgoldenrodyellow;
    }

    .status::after{
        content:"手機橫向 (≥576px) ➜ 1欄";
    }
}

/* 平板 */
@media (min-width:768px){

    body{
        background:lightgreen;
    }

    .status::after{
        content:"平板 (≥768px) ➜ 2欄";
    }

    .card{
        flex:1 1 calc(50% - 10px);
        max-width:calc(50% - 10px);
    }
}

/* 筆電 */
@media (min-width:1024px){

    body{
        background:lightblue;
    }

    .status::after{
        content:"筆電 (≥1024px) ➜ 3欄";
    }

    .card{
        flex:1 1 calc(33.333% - 14px);
        max-width:calc(33.333% - 14px);
    }
}

/* 大桌機 */
@media (min-width:1200px){

    body{
        background:lavender;
    }

    .status::after{
        content:"大型桌機 (≥1200px) ➜ 3欄放大版";
    }

    .gallery-flex{
        max-width:1800px;
    }

    .card{
        flex:1 1 calc(33.333% - 14px);
        max-width:calc(33.333% - 14px);
        height:450px;
    }
}

/* 4K 超大螢幕 */
@media (min-width:1800px){

    .gallery-flex{
        max-width:2200px;
    }

    .card{
        height:550px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Flexbox 響應式風景圖網格</h1>

    <div class="pixel-display">
        <span id="window-width">0</span> px
    </div>

    <h3>
        目前狀態：
        <span class="status"></span>
    </h3>
</div>

<div class="gallery-flex">

    <div class="card">
        <img src="https://picsum.photos/1200/800?random=1" alt="風景圖1">
    </div>

    <div class="card">
        <img src="https://picsum.photos/1200/800?random=2" alt="風景圖2">
    </div>

    <div class="card">
        <img src="https://picsum.photos/1200/800?random=3" alt="風景圖3">
    </div>

    <div class="card">
        <img src="https://picsum.photos/1200/800?random=4" alt="風景圖4">
    </div>

    <div class="card">
        <img src="https://picsum.photos/1200/800?random=5" alt="風景圖5">
    </div>

    <div class="card">
        <img src="https://picsum.photos/1200/800?random=6" alt="風景圖6">
    </div>

</div>

<script>
function updateWidth(){
    document.getElementById('window-width').textContent =
        window.innerWidth;
}

updateWidth();
window.addEventListener('resize', updateWidth);
</script>

</body>
</html>
