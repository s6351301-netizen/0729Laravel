<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精選蛋糕甜點展示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f9f9f9;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            /* 改用 min-height 避免內容超出時被切掉 */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .item {
            width: 80%;
            height: 250px;
            /* 給予固定的高度 */
            margin: 15px;
            border-radius: 12px;
            /* 加上圓角 */
            overflow: hidden;
            /* 確保圖片不超出圓角 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            /* 淡淡的陰影質感 */
        }

        /* 讓圖片完美填滿容器 */
        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 保持比例裁切填滿 */
            display: block;
        }

        @media screen and (min-width: 1024px) {
            .item {
                width: 28%;
                /* 讓三個項目在一行時有適當間距 */
                height: 300px;
                /* 大螢幕稍微放大高度 */
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">
            <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=800&q=80"
                alt="草莓蛋糕">
        </div>
        <div class="item">
            <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=800&q=80"
                alt="巧克力慕斯">
        </div>
        <div class="item">
            <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=800&q=80"
                alt="藍莓起司蛋糕">
        </div>
        <div class="item">
            <img src="https://images.unsplash.com/photo-1519869325930-281384150729?auto=format&fit=crop&w=800&q=80"
                alt="法式檸檬塔">
        </div>
        <div class="item">
            <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500&q=80" alt="經典巧克力蛋糕">
        </div>
        <div class="item">
            <img src="https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=800&q=80"
                alt="綜合水果塔">
        </div>
    </div>
</body>

</html>
